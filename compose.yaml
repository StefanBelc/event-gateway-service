services:

  event-gateway-service:
    image: eclipse-temurin:20-jre-alpine
    container_name: gateway-service
    ports:
      - "8084:8090"
    volumes:
      - ./target:/app
    working_dir: /app
    command: java -jar event-gateway-service-0.0.1-SNAPSHOT.jar
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=gateway-kafka:9092
      - MYAPP_KAFKA_BOOTSTRAP_SERVERS=gateway-kafka:9092
    depends_on:
      - kafka



  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: on-failure:3
    hostname: kafka
    container_name: gateway-kafka
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@gateway-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9096,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://gateway-kafka:9092,EXTERNAL://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9096:9092"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "gateway-kafka:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  kafka-data:
    driver: local
